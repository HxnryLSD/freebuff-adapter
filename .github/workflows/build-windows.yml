name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Release tag (e.g. v0.1.0). Required to publish a GitHub Release from
          a manual run; leave empty to just build and upload the artifacts.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & release (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # electron 43 requires Node >= 22.12 (npm warns EBADENGINE otherwise),
      # and 22 matches the top of the CI matrix in ci.yml.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # electron's postinstall and electron-builder's winCodeSign/NSIS
      # tooling both cache downloads here; without this every build would
      # re-download ~100 MB of Electron.
      # LOCALAPPDATA is a runner machine env var, not one GitHub exposes in
      # the `env` context — capture it in a shell step (where it IS set) and
      # reference it via step outputs.
      - name: Resolve LOCALAPPDATA
        id: localappdata
        shell: pwsh
        run: echo "path=$env:LOCALAPPDATA" >> $env:GITHUB_OUTPUT

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.localappdata.outputs.path }}\electron\Cache
            ${{ steps.localappdata.outputs.path }}\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Run daemon tests
        run: npm test

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Unsigned build. The installers are distributed as-is; Windows
      # SmartScreen will warn on install. See the README for the free-OSS
      # SignPath option if you want a real signature without paying.
      # --publish never: the electron-builder `publish` config exists so that
      # latest.yml + app-update.yml are generated, but the upload happens via
      # softprops below — without this flag electron-builder would try to
      # publish the release itself on a git tag and conflict with it.
      - name: Build installer(s)
        working-directory: desktop
        env:
          # No code-signing cert in CI: prevent electron-builder from
          # attempting to discover/use one from the runner's cert store.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      # latest.yml is the update manifest electron-updater fetches to find the
      # newest version + installer; it must sit next to the exe in the release.
      # softprops/action-gh-release v2 hard-fails on a branch ref without a
      # tag_name, so only run it on a tag push or when the manual run supplies
      # a tag. Tag pushes use github.ref_name; manual runs use the input.
      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true

      # Manual run without a tag: keep the artifacts downloadable from the
      # Actions run instead of failing the workflow.
      - name: Upload build artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.tag_name != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-adapter-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
